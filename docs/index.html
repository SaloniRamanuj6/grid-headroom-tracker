<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Headroom Tracker | National Grid MA and NY</title>
<style>
  .viz-root {
    color-scheme: light;
    --page: #f9f9f7; --surface-1: #fcfcfb;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; --warning: #fab219; --good: #0ca30c; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page: #0d0d0d; --surface-1: #1a1a19;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root {
    background: var(--page); color: var(--text-primary); min-height: 100vh;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 20px 48px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  h2 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); margin: 0 0 20px; }
  .note { color: var(--text-muted); font-size: 13px; margin: 0 0 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  /* state switch */
  .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 10px;
          background: var(--surface-1); border: 1px solid var(--border); margin-bottom: 14px; }
  .tabs button {
    font: inherit; font-weight: 600; border: 0; border-radius: 7px; padding: 6px 16px;
    background: transparent; color: var(--text-secondary); cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--series-1); color: #fff; }
  .tabs button:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  /* banner */
  .banner { display: flex; gap: 12px; align-items: flex-start; border-left: 4px solid var(--warning); }
  .banner.ok { border-left-color: var(--good); }
  .banner svg { flex: none; margin-top: 2px; }
  .banner strong { display: block; }
  /* kpis */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .kpi { margin: 0; }
  .kpi .num { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .kpi .lbl { color: var(--text-secondary); font-size: 14px; }
  .kpi .pct { color: var(--text-muted); font-size: 13px; }
  /* bar charts */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  .charts .card { margin-bottom: 16px; }
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 12px; }
  .bar-label { color: var(--text-secondary); font-size: 14px; text-align: right; }
  .bar-track { position: relative; height: 28px; border-left: 1px solid var(--baseline); }
  .bar-hit { position: absolute; inset: -4px 0; display: flex; align-items: center; }
  .bar { height: 24px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; transition: opacity .15s; }
  .bar-val { margin-left: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .bars:hover .bar { opacity: .45; }
  .bars .bar-row:hover .bar { opacity: 1; }
  @media (max-width: 600px) {
    .charts { grid-template-columns: 1fr; }
    .bar-row { grid-template-columns: 110px 1fr; } .bar-label { font-size: 12px; }
  }
  #tip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  /* tables */
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  input[type=search] {
    font: inherit; padding: 7px 10px; border-radius: 8px; width: 280px; max-width: 100%;
    border: 1px solid var(--baseline); background: var(--page); color: var(--text-primary);
  }
  .count { color: var(--text-muted); font-size: 13px; }
  .scroll { max-height: 420px; overflow: auto; border-top: 1px solid var(--grid); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th {
    position: sticky; top: 0; background: var(--surface-1); text-align: right; white-space: nowrap;
    color: var(--text-secondary); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--baseline);
  }
  td { padding: 7px 10px; border-bottom: 1px solid var(--grid); text-align: right; }
  th.l, td.l { text-align: left; }
  .flag { display: inline-flex; align-items: flex-start; gap: 5px; font-size: 12px; min-width: 150px; }
  .flag i { margin-top: 4px; }
  .flag i { width: 8px; height: 8px; border-radius: 50%; background: var(--critical); display: inline-block; flex: none; }
  footer { color: var(--text-muted); font-size: 13px; margin-top: 24px; }
  footer a, .sub a { color: var(--series-1); }
</style>
</head>

4.92, "pct_rating": 58.1, "flag": null}, {"master_cdf": "36_39_29753", "substation_bank": "SOUTH ST TB 1", "zone": "F", "voltage_kv": 13.2, "max_hc_mw": 10.0, "queued_dg_mw": 0.0, "load_headroom_mw": 5.83, "pct_rating": 40.0, "flag": "See utility note"}, {"master_cdf": "36_39_41554", "substation_bank": "WEIBEL TB 1", "zone": "F", "voltage_kv": 13.2, "max_hc_mw": 10.0, "queued_dg_mw": 0.0, "load_headroom_mw": 3.63, "pct_rating": 69.1, "flag": null}]}], "footnote": "Solar room = max hosting capacity at the best location on the feeder. Load room = load capacity headroom from the EV Load Serving Capacity layer."}};
const fmt = n => Number(n).toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tip = document.getElementById("tip");

const ICONS = {
  warning: `<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 L19 18 H1 Z" fill="#fab219"/><rect x="9" y="7" width="2" height="6" fill="#0b0b0b"/><rect x="9" y="14.5" width="2" height="2" fill="#0b0b0b"/></svg>`,
  ok: `<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#0ca30c"/><path d="M5.5 10.5 L8.5 13.5 L14.5 7" stroke="#fff" stroke-width="2" fill="none"/></svg>`,
};

// How to show one value, by column type
function cell(v, t) {
  if (t === "text") return esc(v);
  if (v === null || v === undefined) return t === "flag" ? "" : "–";
  if (t === "int") return fmt(v);
  if (t === "kv") return Number(v).toFixed(1);
  if (t === "flag") return `<span class="flag"><i></i>${esc(v)}</span>`;
  if (t === "pct") return v > 100 ? `<span class="flag"><i></i>${Number(v).toFixed(0)}%</span>` : Number(v).toFixed(0) + "%";
  return Number(v).toFixed(2);
}

function chart(c, total) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>${esc(c.title)}</h2><p class="note">${esc(c.note)}</p><div class="bars"></div>`;
  const bars = card.querySelector(".bars");
  const max = Math.max(...c.bars.map(b => b.feeders));
  c.bars.forEach(b => {
    const label = b.label.split("|")[1];
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `<div class="bar-label">${esc(label)}</div><div class="bar-track"><div class="bar-hit">
      <div class="bar" style="width:${b.feeders / max * 82}%"></div><span class="bar-val">${fmt(b.feeders)}</span></div></div>`;
    const hit = row.querySelector(".bar-hit");
    hit.addEventListener("mousemove", e => {
      tip.innerHTML = `<strong>${esc(label)}</strong><br>${fmt(b.feeders)} feeders · ${Math.round(b.feeders / total * 100)}% of all`;
      tip.style.display = "block";
      tip.style.left = Math.min(e.clientX + 14, innerWidth - 240) + "px";
      tip.style.top = (e.clientY + 14) + "px";
    });
    hit.addEventListener("mouseleave", () => tip.style.display = "none");
    bars.appendChild(row);
  });
  return card;
}

function table(t) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>${esc(t.title)}</h2>${t.note ? `<p class="note">${esc(t.note)}</p>` : ""}
    <div class="toolbar"><input type="search" placeholder="${esc(t.placeholder)}" aria-label="${esc(t.placeholder)}">
    <span class="count"></span></div><div class="scroll"><table></table></div>`;
  const el = card.querySelector("table");
  const left = c => (c.t === "text" || c.t === "flag") ? "l" : "";
  const head = "<thead><tr>" + t.columns.map(c => `<th class="${left(c)}">${esc(c.h)}</th>`).join("") + "</tr></thead>";
  function draw(q) {
    q = q.trim().toLowerCase();
    const hits = q ? t.rows.filter(r => t.search.some(k => String(r[k] ?? "").toLowerCase().includes(q))) : t.rows;
    el.innerHTML = head + "<tbody>" + hits.map(r => "<tr>" + t.columns.map(c =>
      `<td class="${left(c)}">${cell(r[c.k], c.t)}</td>`).join("") + "</tr>").join("") + "</tbody>";
    card.querySelector(".count").textContent = `${fmt(hits.length)} of ${fmt(t.rows.length)} ${t.noun}`;
  }
  card.querySelector("input").addEventListener("input", e => draw(e.target.value));
  draw("");
  return card;
}

function show(code) {
  const s = DATA[code];
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.code === code));
  document.getElementById("intro").innerHTML = `${esc(s.intro)} Source: <a href="${s.source_link}">${esc(s.name)} System Data Portal</a>.`;
  const banner = document.getElementById("banner");
  banner.className = "card banner " + (s.banner.level === "ok" ? "ok" : "");
  banner.innerHTML = `${ICONS[s.banner.level]}<div><strong>${esc(s.banner.title)}</strong>${esc(s.banner.text)}</div>`;
  document.getElementById("kpis").innerHTML = s.kpis.map(([n, l, p]) =>
    `<div class="card kpi"><div class="num">${fmt(n)}</div><div class="lbl">${esc(l)}</div><div class="pct">${esc(p)}</div></div>`).join("");
  const total = s.kpis[0][0];
  const charts = document.getElementById("charts");
  charts.innerHTML = "";
  s.charts.forEach(c => charts.appendChild(chart(c, c.bars.reduce((a, b) => a + b.feeders, 0) || total)));
  const tables = document.getElementById("tables");
  tables.innerHTML = "";
  s.tables.forEach(t => tables.appendChild(table(t)));
  document.getElementById("footnote").textContent = s.footnote;
  history.replaceState(null, "", "#" + code);
}

// Build the MA / NY switch; the URL remembers your choice (e.g. ...#NY)
const tabs = document.getElementById("tabs");
Object.keys(DATA).forEach(code => {
  const b = document.createElement("button");
  b.textContent = DATA[code].name;
  b.dataset.code = code;
  b.setAttribute("role", "tab");
  b.addEventListener("click", () => show(code));
  tabs.appendChild(b);
});
const start = location.hash.slice(1);
show(DATA[start] ? start : Object.keys(DATA)[0]);
</script>
